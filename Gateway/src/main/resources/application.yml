server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: client-route
          uri: lb://client-service
          predicates:
            - Path=/api/clients/**
        - id: voiture-route
          uri: lb://voiture-service
          predicates:
            - Path=/api/voitures/**

spring:
  config:
    import: "optional:consul:discovery:8500"
  cloud:
    consul:
      host: discovery
      port: 8500
      discovery:
        service-name: gateway-service
        prefer-ip-address: true
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true